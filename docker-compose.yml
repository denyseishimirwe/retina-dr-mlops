services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - ./models:/app/models
      - ./data:/app/data
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      - API_URL=http://nginx:80
    ports:
      - "8501:8501"
    depends_on:
      - nginx
    restart: unless-stopped
